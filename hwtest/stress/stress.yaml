# Stress test (docs/HWTEST.md#stress-test): one disk holding 64 assets of
# 8K, a rolling pattern each (mkstress.py). AUTOEXEC.BAS runs
# STRESS.BIN, which opens the disk and streams all of them into $4000-$5FFF
# over and over, checking each one's checksum, until a key is pressed.

project:
  name: STRESS
  image: build/STRESS.DSK
  equates: build/assets.inc
  table: build/assettab.asm
  map: build/STRESS.map
  disk:
    loader: build/STRESS.BIN
    reserve: 3                  # STRESS.BIN (2 granules) and AUTOEXEC.BAS
    data: STRESS.DAT

assets:
  - {name: s00, file: assets/s00.bin, load: 0x4000}
  - {name: s01, file: assets/s01.bin, load: 0x4000}
  - {name: s02, file: assets/s02.bin, load: 0x4000}
