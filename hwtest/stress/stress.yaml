# Stress test (docs/HWTEST.md#stress-test): one disk holding 256 assets of
# 8K (2M), cut from one LFSR stream (mkstress.py). AUTOEXEC.BAS runs
# STRESS.BIN, which opens the disk and streams all of them into $4000-$5FFF
# over and over, checking every byte, until a key is pressed.

project:
  title: STRESS
  image: build/STRESS.DSK
  equates: build/assets.inc
  table: build/assettab.asm
  map: build/STRESS.map
  disk:
    loader: build/STRESS.BIN
    reserve: 4                  # STRESS.BIN (3 granules) and AUTOEXEC.BAS
    data: STRESS.DAT

assets:
  - {name: s000, file: assets/s000.bin, load: 0x4000}
