# Hardware test: a 35-track single-file disk. AUTOEXEC.BAS runs HWTEST.BIN,
# which streams every asset from this disk (no mount), checks the bytes, then
# mounts HWTEST.SDS by name and finally HWTEST.DSK again. See docs/HWTEST.md.

project:
  title: HWTEST
  image: build/HWTEST.DSK
  equates: build/disk/assets.inc
  table: build/disk/assettab.asm
  map: build/HWTEST.map
  disk:
    loader: build/HWTEST.BIN

assets:
  - {name: a_odd,   file: assets/a_odd.bin,   load: 0x3000}   # odd length
  - {name: b_pack,  file: assets/b_pack.bin,  load: 0x3301}   # odd offset, odd address
  - {name: c_multi, file: assets/c_multi.bin, load: 0x3500}   # spans 3 blocks
  - {name: d_align, file: assets/d_align.bin, load: 0x3B00, align: true}
  - {name: e_code,  file: assets/e_code.bin,  type: decb}     # 2 segments, exec $3E00
  - {name: f_phys,  file: assets/f_phys.bin,  phys: 0x60001}  # CoCo 3: 3 MMU windows
  - {name: t_blk,   file: assets/t_blk.bin,   load: 0x4000, align: true}  # timing: 1 block
  - {name: t_run,   file: assets/t_run.bin,   load: 0x4000, align: true}  # timing: 16 blocks
