# dmpkg project manifest
project:
  name: Demo
  image: build/DEMO.SDS        # copy to the SD card as GAMES/DEMO.SDS
  sdc_path: GAMES/DEMO.SDS     # path the CoCo mounts (8.3, dirs allowed)
  equates: build/assets.inc    # EQUs only
  table: build/assettab.asm    # mount name, build_id, descriptors
  map: build/DEMO.map

assets:
  - name: font
    file: assets/font.bin
    load: "$6000"              # CPU address (quoted: YAML reads $ as text anyway)

  - name: palette
    file: assets/palette.bin
    load: 0x6400               # packed right after font (assets don't align by default)

  - name: level1
    file: assets/level1.bin
    load: 0x6500

  - name: map
    file: assets/map.bin
    load: 0x7000

  - name: title
    file: assets/title.gfx
    phys: 0x7A001              # CoCo 3 physical address, loaded via MMU window
    align: true                # start on a fresh 512-byte block

  - name: code
    file: assets/code.bin
    type: decb                 # LOADM binary: segments go to their own addresses
