# dmpkg project manifest

project:
  title: Demo                  # in the image header (16 chars), shown by dmpkg list
  image: build/DEMO.DSK        # one file: copy to the SD card, DRIVE 0,"DEMO.DSK"
  equates: build/assets.inc    # EQUs only
  table: build/assettab.asm    # mount name, build_id, descriptors
  map: build/DEMO.map          # layout report: size, assets, disk map (optional)
  disk:                        # the image is also a DECB disk holding the loader
    loader: build/LOADER.BIN   # assembled from loader.asm against the files above
    autoexec: true             # AUTOEXEC.BAS: LOADM"LOADER.BIN":EXEC

# Without disk:, the image is a bare stream image (e.g. build/DEMO.SDS) that
# the program mounts by name: add sdc_path: GAMES/DEMO.SDS (8.3, dirs allowed).

assets:
  - name: font
    file: assets/font.bin
    load: "$6000"              # CPU address (quoted: YAML reads $ as text anyway)

  - name: palette
    file: assets/palette.bin
    load: 0x6400               # packed right after font (assets don't align by default)

  - name: level1
    file: assets/level1.bin
    load: 0x6500

  - name: map
    file: assets/map.bin
    load: 0x7000

  - name: title
    file: assets/title.gfx
    phys: 0x60001              # CoCo 3 physical address, loaded via MMU window
    align: true                # start on a fresh 512-byte block

  - name: code
    file: assets/code.bin
    type: decb                 # LOADM binary: segments go to their own addresses
